[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-quant"
version = "1.2.0"
description = "RWKV-7 Quantization Toolkit - FP8 / INT8 / INT4"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AUXStar"}
]
keywords = ["rwkv", "quantization", "fp8", "int8", "int4", "inference", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
rich = ["rich>=10.0.0"]
all = ["rich>=10.0.0"]
dev = ["pytest", "rich>=10.0.0"]

[project.scripts]
rwkv-quant = "rwkv_quant.cli:main"

[project.urls]
Homepage = "https://github.com/AUXStar/rwkv7-quantization"
Repository = "https://github.com/AUXStar/rwkv7-quantization"

[tool.setuptools]
packages = ["rwkv_quant"]
