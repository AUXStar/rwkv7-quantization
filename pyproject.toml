[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rwkv-quant-nv"
version = "1.2.0"
description = "RWKV-7 Quantization Toolkit - FP8 / INT8 / INT4 (NVIDIA CUDA)"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [
    {name = "AUXStar"}
]
keywords = ["rwkv", "rwkv-7", "quantization", "fp8", "int8", "int4", "nvfp4", "inference", "llm", "cuda"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
]

[project.optional-dependencies]
rich = ["rich>=10.0.0"]
all = ["rich>=10.0.0"]
dev = ["pytest", "rich>=10.0.0"]

[project.scripts]
rwkv-quant = "rwkv_quant.cli:main"

[project.urls]
Homepage = "https://github.com/AUXStar/rwkv7-quantization"
Repository = "https://github.com/AUXStar/rwkv7-quantization"

[tool.setuptools]
packages = ["rwkv_quant", "cuda"]
py-modules = ["schemes", "fp8_ops", "fused_fp8_gemm", "rwkv7_fast_v3a"]

[tool.setuptools.package-data]
cuda = ["*.cpp", "*.cu"]
