[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "rwkv-quant"
version = "1.0.0"
description = "RWKV-7 Quantization Toolkit - FP8 / INT8 / INT4"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "AUXStar"}
]
keywords = ["rwkv", "quantization", "fp8", "int8", "int4", "inference", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware :: Hardware Drivers",
]
dependencies = [
    "torch>=1.12.0",
]

[project.optional-dependencies]
rich = ["rich>=10.0.0"]
all = ["rich>=10.0.0", "triton>=2.0"]
dev = ["pytest", "rich>=10.0.0"]

[project.scripts]
rwkv-quant = "rwkv_quant:main"

[project.urls]
Homepage = "https://github.com/AUXStar/rwkv7-quantization"
Repository = "https://github.com/AUXStar/rwkv7-quantization"
Issues = "https://github.com/AUXStar/rwkv7-quantization/issues"

[tool.setuptools]
py-modules = ["rwkv_quant"]

[tool.setuptools.packages.find]
include = ["rwkv_quant*"]
